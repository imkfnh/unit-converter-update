<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Converter">
  <meta name="theme-color" content="#001A3D">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amaranth&display=swap" rel="stylesheet">
</head>

<body>

  <main class="page">

    <!-- Converter Card -->
    <section class="card converter-card">
      <input id="inputValue" type="text" inputmode="decimal" placeholder="enter value">
      <button id="negBtn" class="action-btn" style="display:none;">± negative</button>

      <div class="unit-row">
        <select id="fromUnit"></select>
        <button id="swapIcon" class="swap-icon" aria-label="swap units">⇄</button>
        <select id="toUnit"></select>
      </div>

      <div class="result-box">
        <div id="result"></div>
        <div id="fractionResult" class="fraction-line"></div>
      </div>

      <button id="swapBtn" class="action-btn">swap units</button>
      <button id="mixedBtn" class="action-btn secondary" style="display:none;">whole parts</button>
      <button id="roundBtn" class="action-btn" style="display:none;">round</button>
    </section>

    <!-- Category Card -->
    <section class="card">
      <h2 class="card-title">select category</h2>
      <div id="categoryList" class="category-grid"></div>
    </section>

  </main>

  <!-- Header image (now at the bottom) -->
  <header class="app-header">
    <img src="header.jpeg" class="header-img" alt="">
  </header>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Amaranth", Arial, sans-serif;
    background-color: #0A1A33;
    color: #CFE8FF;
  }

  /* Header */
  .app-header {
    width: 100%;
    height: 120px;
    background: #001A3D;
  }

  .header-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Page + cards */
  .page {
    padding: 24px 20px 0;
  }

  .card {
    background: #01356F;
    padding: 22px 18px;
    border-radius: 28px;
    max-width: 380px;
    margin: 0 auto 40px;
  }

  .card-title {
    margin: 0 0 18px;
    padding-left: 4px;
    font-size: 2rem;
    font-weight: normal;
    color: #FFFFFF;
  }

  /* Category buttons */
  .category-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .cat-btn {
    flex: 0 0 calc((100% - 20px) / 3);
    padding: 12px 4px;
    font-family: inherit;
    font-size: 0.95rem;
    color: #FFFFFF;
    background: linear-gradient(180deg, #3A5BA0, #2C447A);
    border: 2px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .cat-btn.active {
    border-color: #72C7FC;
  }

  .cat-btn:active {
    transform: scale(0.97);
  }

  /* Input + selects */
  input,
  select {
    font-family: inherit;
    font-size: 1.7rem;
    color: #72C7FC;
    background-color: #02519C;
    border: 2px solid #3A8AD0;
    border-radius: 10px;
    text-align: center;
    -webkit-appearance: none;
    appearance: none;
  }

  input {
    display: block;
    width: 80%;
    margin: 10px auto 0;
    padding: 14px;
  }

  input::placeholder {
    color: #8A97A8;
  }

  .unit-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 28px 0;
  }

  .swap-icon {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: 1.5rem;
    color: #FFFFFF;
    background: linear-gradient(180deg, #3A5BA0, #2C447A);
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }

  .swap-icon:active {
    transform: scale(0.92);
  }

  /* Time picker (timezone category) */
  input[type="time"] {
    min-height: 62px;
  }

  input[type="time"]::-webkit-date-and-time-value {
    text-align: center;
  }

  select {
    flex: 1;
    min-width: 0;
    padding: 12px 4px;
    font-size: 1.5rem;
    text-align-last: center;
    text-overflow: ellipsis;
  }

  /* Result box */
  .result-box {
    margin: 0 auto 28px;
    padding: 24px 16px;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #001A33;
    border-radius: 30px;
  }

  #result {
    font-size: 2.2rem;
    min-height: 2.2rem;
    word-break: break-word;
  }

  #result.small {
    font-size: 1.7rem;
  }

  .fraction-line {
    margin-top: 6px;
    font-size: 1.2rem;
    color: #A8D9FF;
  }

  /* Action buttons */
  .action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin: 14px 0 0;
    padding: 18px 20px;
    font-family: inherit;
    font-size: 1.4rem;
    color: #FFFFFF;
    background: linear-gradient(180deg, #3A5BA0, #2C447A);
    border: none;
    border-radius: 18px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .action-btn:active {
    transform: scale(0.97);
  }

  .action-btn.secondary {
    width: calc((100% - 20px) / 3);
    margin: 14px auto 0;
    padding: 12px 4px;
    font-size: 0.95rem;
    border: 2px solid transparent;
    border-radius: 14px;
  }

  .action-btn.secondary.on {
    border-color: #72C7FC;
  }
</style>


<script>

/* -----------------------------
   LABELS + PRETTY UNIT SYMBOLS
------------------------------*/
const unitLabels = {
  cups: "cups",
  ounces: "oz",
  tablespoons: "tbsp",
  teaspoons: "tsp",
  pints: "pt",
  quarts: "qt",
  gallons: "gal",
  milliliters: "mL",
  liters: "L",

  sqft: "ft²",
  sqyd: "yd²",
  acre: "acre",
  sqmi: "mi²",
  sqkm: "km²",
  sqin: "in²",
  sqmm: "mm²",
  sqcm: "cm²",
  sqm: "m²",
  hectare: "hectare",

  celsius: "°C",
  fahrenheit: "°F",

  grams: "g",
  kilograms: "kg",
  pounds: "lb",

  kmh: "km/h",
  mph: "mph",
  knots: "knots",

  cm: "cm",
  m: "m",
  inches: "in",
  feet: "ft",
  km: "km",
  miles: "mi",

  UTC: "UTC",
  MST: "MST",
  CST: "CST",
  EST: "EST",
  PST: "PST",

  EUR: "EUR",
  USD: "USD",
  GBP: "GBP",
  CAD: "CAD",
  AUD: "AUD"
};

const prettyUnits = {
  cups: "cups",
  ounces: "oz",
  tablespoons: "tbsp",
  teaspoons: "tsp",
  pints: "pt",
  quarts: "qt",
  gallons: "gal",
  milliliters: "mL",
  liters: "L",

  sqft: "ft²",
  sqyd: "yd²",
  acre: "ac",
  sqmi: "mi²",
  sqkm: "km²",
  sqin: "in²",
  sqmm: "mm²",
  sqcm: "cm²",
  sqm: "m²",
  hectare: "ha",

  celsius: "°C",
  fahrenheit: "°F",

  grams: "g",
  kilograms: "kg",
  pounds: "lb",

  kmh: "km/h",
  mph: "mph",
  knots: "kn",

  cm: "cm",
  m: "m",
  inches: "in",
  feet: "ft",
  km: "km",
  miles: "mi",

  UTC: "UTC",
  MST: "MST",
  CST: "CST",
  EST: "EST",
  PST: "PST",

  EUR: "EUR",
  USD: "USD",
  GBP: "GBP",
  CAD: "CAD",
  AUD: "AUD"
};

/* -----------------------------
   CONVERTER ENGINE
------------------------------*/
class ConverterEngine {
  constructor() {
    this.categories = {
      volume: ["tablespoons", "teaspoons", "cups", "ounces", "pints", "quarts", "gallons", "milliliters", "liters"],
      temperature: ["celsius", "fahrenheit"],
      weight: ["grams", "kilograms", "ounces", "pounds"],
      speed: ["kmh", "mph", "knots"],
      timezone: ["UTC", "MST", "CST", "EST", "PST"],
      length: ["cm", "m", "inches", "feet", "km", "miles"],
      currency: ["EUR", "USD", "GBP", "CAD", "AUD"],
      area: ["sqft", "sqyd", "acre", "sqmi", "sqkm", "sqin", "sqmm", "sqcm", "sqm", "hectare"]
    };

    this.defaults = {
      volume: ["tablespoons", "milliliters"],
      temperature: ["celsius", "fahrenheit"],
      weight: ["kilograms", "pounds"],
      speed: ["kmh", "mph"],
      timezone: ["UTC", "MST"],
      length: ["cm", "inches"],
      currency: ["EUR", "USD"],
      area: ["sqm", "sqft"]
    };

    // "Whole parts" chains: [bigger unit, smaller unit] for each target unit
    this.mixedChains = {
      volume: {
        gallons: ["gallons", "quarts"],
        quarts: ["quarts", "pints"],
        pints: ["pints", "cups"],
        cups: ["cups", "tablespoons"],
        ounces: ["ounces", "tablespoons"],
        tablespoons: ["tablespoons", "teaspoons"],
        liters: ["liters", "milliliters"]
      },
      length: {
        miles: ["miles", "feet"],
        feet: ["feet", "inches"],
        km: ["km", "m"],
        m: ["m", "cm"]
      },
      weight: {
        pounds: ["pounds", "ounces"],
        kilograms: ["kilograms", "grams"]
      }
    };
  }

  getUnits(category) {
    return this.categories[category] || [];
  }

  getDefaultUnits(category) {
    return this.defaults[category] || [];
  }

  supportsMixed(category) {
    return !!this.mixedChains[category];
  }

  // Turns a result like 3.3 ft into "3 ft 4 in". Returns null if not possible.
  toMixed(category, value, to) {
    const chain = this.mixedChains[category] && this.mixedChains[category][to];
    if (!chain) return null;

    const [big, small] = chain;
    const sign = value < 0 ? "-" : "";
    const abs = Math.abs(value);

    const ratio = Math.round(this.convert(category, 1, big, small));
    const totalSmall = Math.round(this.convert(category, abs, big, small));
    if (totalSmall === 0) return null;

    const whole = Math.floor(totalSmall / ratio);
    const rest = totalSmall % ratio;

    const parts = [];
    if (whole > 0) parts.push(`${whole} ${prettyUnits[big]}`);
    if (rest > 0) parts.push(`${rest} ${prettyUnits[small]}`);

    const separator = category === "volume" ? " + " : " ";
    return sign + parts.join(separator);
  }

  // Time zones: minutes after midnight in, minutes + day shift out
  convertTime(minutes, from, to) {
    const offsets = { UTC: 0, MST: -7, CST: -6, EST: -5, PST: -8 };
    const total = minutes + (offsets[to] - offsets[from]) * 60;
    const dayShift = Math.floor(total / 1440);
    const wrapped = ((total % 1440) + 1440) % 1440;
    return { minutes: wrapped, dayShift };
  }

  convert(category, value, from, to) {
    if (isNaN(value)) return "";

    switch (category) {

      /* VOLUME: each number = units per 1 cup */
      case "volume": {
        const vol = {
          cups: 1,
          ounces: 8,
          tablespoons: 16,
          teaspoons: 48,
          pints: 0.5,
          quarts: 0.25,
          gallons: 0.0625,
          milliliters: 236.588,
          liters: 0.236588
        };
        return value * (vol[to] / vol[from]);
      }

      /* TEMPERATURE */
      case "temperature":
        if (from === "celsius" && to === "fahrenheit") return value * 9/5 + 32;
        if (from === "fahrenheit" && to === "celsius") return (value - 32) * 5/9;
        return value;

      /* WEIGHT */
      case "weight": {
        const wt = {
          grams: 1,
          kilograms: 1000,
          ounces: 28.3495,
          pounds: 453.592
        };
        const gramsValue = value * wt[from];
        return gramsValue / wt[to];
      }

      /* SPEED (base unit = km/h) */
      case "speed": {
        const spd = {
          kmh: 1,
          mph: 1.609344,
          knots: 1.852
        };
        const kmhValue = value * spd[from];
        return kmhValue / spd[to];
      }

      /* LENGTH */
      case "length": {
        const len = {
          cm: 0.01,
          m: 1,
          inches: 0.0254,
          feet: 0.3048,
          km: 1000,
          miles: 1609.34
        };
        return value * len[from] / len[to];
      }


      /* AREA */
      case "area": {
        const area = {
          sqft: 0.092903,
          sqyd: 0.836127,
          acre: 4046.856422,
          sqmi: 2589988.110336,
          sqkm: 1000000,
          sqin: 0.00064516,
          sqmm: 0.000001,
          sqcm: 0.0001,
          sqm: 1,
          hectare: 10000
        };
        const sqmValue = value * area[from];
        return sqmValue / area[to];
      }

      /* CURRENCY */
      case "currency": {
        const rates = {
          EUR: 1.0,
          USD: 1.08,
          GBP: 0.86,
          CAD: 1.47,
          AUD: 1.62
        };
        return value * (rates[to] / rates[from]);
      }

      default:
        return value;
    }
  }
}

/* -----------------------------
   FRACTION APPROXIMATION
------------------------------*/
function approximateFraction(value, denominators) {
  const whole = Math.floor(value);
  const frac = value - whole;
  if (frac === 0) return whole.toString();

  let bestNum = 0;
  let bestDen = 1;
  let bestDiff = Infinity;

  denominators.forEach(den => {
    const num = Math.round(frac * den);
    const diff = Math.abs(frac - num / den);
    if (diff < bestDiff && num !== 0) {
      bestDiff = diff;
      bestNum = num;
      bestDen = den;
    }
  });

  if (bestNum === bestDen) return (whole + 1).toString();
  if (whole === 0) return `${bestNum}/${bestDen}`;
  return `${whole} ${bestNum}/${bestDen}`;
}

/* -----------------------------
   TIME FORMAT (12-hour)
------------------------------*/
function formatTime(totalMinutes) {
  const h24 = Math.floor(totalMinutes / 60);
  const min = totalMinutes % 60;
  const suffix = h24 >= 12 ? "PM" : "AM";
  const h12 = h24 % 12 || 12;
  return `${h12}:${String(min).padStart(2, "0")} ${suffix}`;
}

/* -----------------------------
   UI BINDER
------------------------------*/
class UIBinder {
  constructor(engine) {
    this.engine = engine;

    // Order the category buttons appear on screen
    this.categoryOrder = [
      "volume", "timezone", "area",
      "temperature", "length", "weight",
      "currency", "speed"
    ];

    this.inputEl = document.getElementById("inputValue");
    this.fromEl = document.getElementById("fromUnit");
    this.toEl = document.getElementById("toUnit");
    this.resultEl = document.getElementById("result");
    this.fractionEl = document.getElementById("fractionResult");

    this.swapBtn = document.getElementById("swapBtn");
    this.roundBtn = document.getElementById("roundBtn");
    this.negBtn = document.getElementById("negBtn");
    this.mixedBtn = document.getElementById("mixedBtn");
    this.swapIcon = document.getElementById("swapIcon");

    this.categoryList = document.getElementById("categoryList");

    this.currentCategory = "volume";
    this.mixedMode = false;
  }

  init() {
    this.populateCategoryButtons();
    this.setCategory("volume");

    this.inputEl.addEventListener("input", () => this.updateResult());
    this.fromEl.addEventListener("change", () => this.updateResult());
    this.toEl.addEventListener("change", () => this.updateResult());

    this.swapBtn.addEventListener("click", () => this.handleSwap());
    this.roundBtn.addEventListener("click", () => this.handleRound());
    this.negBtn.addEventListener("click", () => this.handleNegative());
    this.swapIcon.addEventListener("click", () => this.handleSwap());
    this.mixedBtn.addEventListener("click", () => this.toggleMixed());
    this.inputEl.addEventListener("change", () => this.updateResult());
  }

  populateCategoryButtons() {
    this.categoryList.innerHTML = this.categoryOrder
      .map(c => `<button class="cat-btn" data-cat="${c}">${c}</button>`)
      .join("");

    this.categoryList.addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-btn");
      if (!btn) return;
      this.setCategory(btn.getAttribute("data-cat"));
    });
  }

  populateUnits(category) {
    const units = this.engine.getUnits(category);
    const options = units
      .map(u => `<option value="${u}">${unitLabels[u]}</option>`)
      .join("");

    this.fromEl.innerHTML = options;
    this.toEl.innerHTML = options;

    const [defFrom, defTo] = this.engine.getDefaultUnits(category);
    this.fromEl.value = defFrom;
    this.toEl.value = defTo;
  }

  updateResult() {
    const raw = this.inputEl.value.trim();
    const from = this.fromEl.value;
    const to = this.toEl.value;

    this.resultEl.classList.remove("small");

    // Time zones work with a clock time instead of a number
    if (this.currentCategory === "timezone") {
      this.updateTimeResult(raw, from, to);
      return;
    }

    const value = parseFloat(raw);

    if (raw === "" || isNaN(value)) {
      this.resultEl.textContent = "";
      this.fractionEl.textContent = "";
      return;
    }

    const result = this.engine.convert(this.currentCategory, value, from, to);
    const prettyUnit = prettyUnits[to];

    // Whole parts mode: 3.3 ft -> 3 ft 4 in
    if (this.mixedMode) {
      const mixed = this.engine.toMixed(this.currentCategory, result, to);
      if (mixed) {
        this.resultEl.textContent = mixed;
        this.resultEl.classList.add("small");
        this.fractionEl.textContent = "";
        return;
      }
    }

    this.resultEl.textContent = `${result.toFixed(2)} ${prettyUnit}`;

    // Fractions only make sense for non-metric volume units
    if (this.currentCategory === "volume" && to !== "milliliters" && to !== "liters") {
      const denominators = [2, 3, 4, 6, 8, 16];

      if (Number.isInteger(result)) {
        this.resultEl.textContent = `${result} ${prettyUnit}`;
        this.fractionEl.textContent = "";
      } else {
        const frac = approximateFraction(result, denominators);
        this.fractionEl.textContent = `≈ ${frac} ${prettyUnit}`;
      }
    } else {
      this.fractionEl.textContent = "";
    }
  }

  updateTimeResult(raw, from, to) {
    const parts = raw.split(":");
    const h = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);

    if (raw === "" || isNaN(h) || isNaN(m)) {
      this.resultEl.textContent = "";
      this.fractionEl.textContent = "";
      return;
    }

    const res = this.engine.convertTime(h * 60 + m, from, to);
    this.resultEl.textContent = formatTime(res.minutes);

    if (res.dayShift > 0) this.fractionEl.textContent = "next day";
    else if (res.dayShift < 0) this.fractionEl.textContent = "previous day";
    else this.fractionEl.textContent = "";
  }

  toggleMixed() {
    this.mixedMode = !this.mixedMode;
    this.mixedBtn.classList.toggle("on", this.mixedMode);
    this.updateResult();
  }

  handleSwap() {
    const temp = this.fromEl.value;
    this.fromEl.value = this.toEl.value;
    this.toEl.value = temp;
    this.updateResult();
  }

  handleNegative() {
    const raw = this.inputEl.value.trim();
    this.inputEl.value = raw.startsWith("-") ? raw.slice(1) : "-" + raw;
    this.updateResult();
  }

  handleRound() {
    if (this.currentCategory !== "length") return;

    const raw = this.inputEl.value.trim();
    const value = parseFloat(raw);
    if (raw === "" || isNaN(value)) return;

    const from = this.fromEl.value;
    const to = this.toEl.value;
    const result = this.engine.convert(this.currentCategory, value, from, to);

    const denominators = [2, 3, 4, 5, 8, 16];
    const frac = approximateFraction(result, denominators);
    const prettyUnit = prettyUnits[to];

    this.fractionEl.textContent = `≈ ${frac} ${prettyUnit}`;
  }

  setCategory(category) {
    const wasTime = this.currentCategory === "timezone";
    const isTime = category === "timezone";

    this.currentCategory = category;
    this.populateUnits(category);

    // Timezone uses a time picker (default 12:00 AM); everything else uses numbers
    if (isTime) {
      this.inputEl.type = "time";
      this.inputEl.removeAttribute("inputmode");
      if (!wasTime) this.inputEl.value = "00:00";
    } else {
      this.inputEl.type = "text";
      this.inputEl.setAttribute("inputmode", "decimal");
      if (wasTime) this.inputEl.value = "";
    }

    // Highlight the active category button
    this.categoryList.querySelectorAll(".cat-btn").forEach(btn => {
      btn.classList.toggle("active", btn.getAttribute("data-cat") === category);
    });

    // Category-specific buttons
    this.negBtn.style.display = category === "temperature" ? "flex" : "none";
    this.roundBtn.style.display = category === "length" ? "flex" : "none";
    this.mixedBtn.style.display = this.engine.supportsMixed(category) ? "flex" : "none";

    this.updateResult();
  }
}

/* -----------------------------
   INITIALIZE APP
------------------------------*/
window.addEventListener("DOMContentLoaded", () => {
  const engine = new ConverterEngine();
  const ui = new UIBinder(engine);
  ui.init();
});

/* -----------------------------
   SERVICE WORKER
------------------------------*/
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
